<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="815" viewBox="0 0 1120 815" role="img" aria-label="El ciclo SDD en THE WOLF"><rect width="1120" height="815" fill="#0B0B0B"/><path d="M0 0H1120" stroke="#D4AF37" stroke-width="12"/><g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="58" font-size="19" fill="#D4AF37" font-weight="700">THE WOLF   /   TFI · ACTIVIDAD 4</text><text x="56" y="120" font-size="43" fill="#FFFFFF" font-weight="700">El ciclo SDD en THE WOLF</text><text x="56" y="162" font-size="22" fill="#E5E7EB" font-weight="400">Un recorrido por la decisión sobre la descripción del catálogo</text><rect x="56" y="191" width="1008" height="60" rx="8" fill="#252525"/><text x="77" y="228" font-size="23" fill="#D4AF37" font-weight="700">00</text><text x="139" y="228" font-size="25" fill="#FFFFFF" font-weight="700">Constitución</text><text x="394" y="228" font-size="21" fill="#E5E7EB" font-weight="400">Reglas de marca, pruebas y seguridad.</text><rect x="56" y="259" width="1008" height="60" rx="8" fill="#252525"/><text x="77" y="296" font-size="23" fill="#D4AF37" font-weight="700">01</text><text x="139" y="296" font-size="25" fill="#FFFFFF" font-weight="700">Especificación</text><text x="394" y="296" font-size="21" fill="#E5E7EB" font-weight="400">CAT-RF04 define la información del producto.</text><rect x="56" y="327" width="1008" height="60" rx="8" fill="#252525"/><text x="77" y="364" font-size="23" fill="#D4AF37" font-weight="700">02</text><text x="139" y="364" font-size="25" fill="#FFFFFF" font-weight="700">Clarificación</text><text x="394" y="364" font-size="21" fill="#E5E7EB" font-weight="400">La descripción queda en «Ver detalle».</text><rect x="56" y="395" width="1008" height="60" rx="8" fill="#252525"/><text x="77" y="432" font-size="23" fill="#D4AF37" font-weight="700">03</text><text x="139" y="432" font-size="25" fill="#FFFFFF" font-weight="700">Plan</text><text x="394" y="432" font-size="21" fill="#E5E7EB" font-weight="400">Se separan tarjeta, ventana de detalle y datos.</text><rect x="56" y="463" width="1008" height="60" rx="8" fill="#252525"/><text x="77" y="500" font-size="23" fill="#D4AF37" font-weight="700">04</text><text x="139" y="500" font-size="25" fill="#FFFFFF" font-weight="700">Tareas</text><text x="394" y="500" font-size="21" fill="#E5E7EB" font-weight="400">Se prueba y corrige la información de cada vista.</text><rect x="56" y="531" width="1008" height="60" rx="8" fill="#252525"/><text x="77" y="568" font-size="23" fill="#D4AF37" font-weight="700">05</text><text x="139" y="568" font-size="25" fill="#FFFFFF" font-weight="700">Implementación</text><text x="394" y="568" font-size="21" fill="#E5E7EB" font-weight="400">La descripción se muestra en el detalle.</text><rect x="56" y="599" width="1008" height="60" rx="8" fill="#252525"/><text x="77" y="636" font-size="23" fill="#D4AF37" font-weight="700">06</text><text x="139" y="636" font-size="25" fill="#FFFFFF" font-weight="700">Validación</text><text x="394" y="636" font-size="21" fill="#E5E7EB" font-weight="400">Se revisa el caso normal y el texto alternativo.</text><rect x="56" y="667" width="1008" height="60" rx="8" fill="#252525"/><text x="77" y="704" font-size="23" fill="#D4AF37" font-weight="700">07</text><text x="139" y="704" font-size="25" fill="#FFFFFF" font-weight="700">Cambio</text><text x="394" y="704" font-size="21" fill="#E5E7EB" font-weight="400">La ubicación acordada queda registrada en la spec.</text><text x="56" y="760" font-size="17" fill="#C0C0C0" font-weight="400">Fuente: specs/001-catalogo y docs/CONSTITUCION.md.</text><text x="56" y="788" font-size="16" fill="#C0C0C0" font-weight="400">Diseño y código asistidos por IA · Datos del proyecto</text></g></svg>